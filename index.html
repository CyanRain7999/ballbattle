<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>球斗竞技场 · ORB ARENA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 选择屏 ============ -->
<div id="screen-select" class="screen active">
  <canvas id="select-fx"></canvas>
  <div class="title" data-text="球斗竞技场">球斗竞技场</div>
  <div class="subtitle">ORB ARENA <span class="b">//</span> 斗蛐蛐模拟系统 <span class="b">v2.0</span></div>
  <div class="mode-switch" id="mode-switch">
    <button class="mode-btn sel" data-mode="2">双球 2P</button>
    <button class="mode-btn" data-mode="3">三球 3P</button>
    <button class="mode-btn" data-mode="4">四球 4P</button>
    <button class="mode-btn" data-mode="5">2V2 团战</button>
    <button class="mode-btn" data-mode="6">4V1 BOSS</button>
  </div>
  <div class="rules-switch" id="rules-switch">
    <button class="rule-btn" data-rule="shrink" title="每 20s 场地内缩一级（最多 3 级），贴圈持续灼伤">⏳ 缩圈 SHRINK</button>
    <button class="rule-btn" data-rule="obstacles" title="点击切换：十字墙 / 四角块 / 迷宫块 / 旋转隔板 / 九宫格 / 八块环 / 之字柱 / 随机 / 对称随机">▣ 障碍 OBSTACLE</button>
    <button class="rule-btn" data-rule="multiSkill" title="每个球可选主能力 + 副能力（副能力 CD+30%、伤害 ×0.5）">❖ 双能力 DUAL</button>
    <button class="rule-btn" data-rule="firepower" title="火力全开：切换为能力槽界面，每个球最多 3 个能力（副槽 CD+30%、伤害 ×0.5）">🔥 火力全开 FIRE</button>
  </div>
  <div class="select-body" id="select-body"></div>
  <div class="multi-actions" id="multi-actions" style="display:none">
    <div class="multi-hint" id="multi-hint"></div>
    <button class="btn" id="btn-random2">⚄ 随机配置</button>
    <button class="btn" id="btn-balance">⚙ 数值</button>
    <button class="btn primary" id="btn-start2">▶ 启动战斗</button>
  </div>
</div>

<!-- ============ 转场屏 ============ -->
<div id="screen-transition" class="screen">
  <div class="trans-grid"></div>
  <div class="trans-glitch"></div>
  <div class="trans-inner">
    <div class="trans-title">COMBAT INITIALIZATION</div>
    <div class="trans-log" id="trans-log"></div>
    <div class="trans-bar"><div class="trans-fill" id="trans-fill"></div></div>
    <div class="trans-pct" id="trans-pct">0%</div>
  </div>
</div>

<!-- ============ 战斗屏 ============ -->
<div id="screen-battle" class="screen">
  <canvas id="battle-canvas"></canvas>
  <div id="hud">
    <!-- hud-side 面板由 buildHUD() 按模式动态生成 -->
    <div class="hud-mid">
      <div class="hud-time" id="hud-time">00:00</div>
      <div class="hud-vs" id="hud-vs">VS</div>
    </div>
  </div>
  <button class="btn corner-btn" id="btn-pause" title="暂停">⏸</button>
  <button class="btn corner-btn" id="btn-sound" title="音效">♪</button>
  <div id="pause-overlay"><span>PAUSED</span></div>
</div>

<!-- ============ 结算屏 ============ -->
<div id="screen-result" class="screen">
  <canvas id="fx-canvas"></canvas>
  <div class="result-inner">
    <div class="result-tag">WINNER CONFIRMED</div>
    <div class="result-title" id="result-title">WINNER</div>
    <canvas id="result-canvas" width="200" height="200"></canvas>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-btns">
      <button class="btn primary" id="btn-again">↻ 再战一场</button>
      <button class="btn ghost" id="btn-reconfig">⚙ 重新配置</button>
    </div>
  </div>
</div>

  <script src="js/core.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/data.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/select.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
