<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>球斗竞技场 · ORB ARENA</title>
<style>
/* ================= 基础 ================= */
:root{
  --bg:#04070f; --panel:#0a1322; --line:#1b2a44;
  --cyan:#00e5ff; --magenta:#ff2d78; --green:#3dff9e;
  --amber:#ffb020; --text:#cfe8ff; --dim:#5f7fa6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 78%);
          mask-image:radial-gradient(ellipse at center,#000 20%,transparent 78%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:900;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.014) 3px 4px)}

/* ================= 屏幕容器 ================= */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.screen.active{display:flex;animation:screenIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes screenIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}

/* ================= 标题 ================= */
.title{position:relative;font-size:36px;letter-spacing:.4em;text-indent:.4em;font-weight:800;
  background:linear-gradient(90deg,var(--cyan),#fff 50%,var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(0,229,255,.45));
  animation:titlePulse 3s ease-in-out infinite alternate}
@keyframes titlePulse{from{filter:drop-shadow(0 0 14px rgba(0,229,255,.35))}to{filter:drop-shadow(0 0 26px rgba(255,45,120,.45))}}
.title::after{content:attr(data-text);position:absolute;inset:0;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,var(--magenta),#fff 50%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  mix-blend-mode:screen;animation:titleGlitch 4s steps(1) infinite}
@keyframes titleGlitch{
  0%,91%,100%{opacity:0;clip-path:inset(0 0 100% 0)}
  92%{opacity:.85;clip-path:inset(12% 0 48% 0);transform:translateX(4px)}
  94%{opacity:.85;clip-path:inset(56% 0 10% 0);transform:translateX(-4px)}
  96%{opacity:.6;clip-path:inset(32% 0 42% 0);transform:translateX(3px)}
  98%{opacity:.4;clip-path:inset(72% 0 6% 0);transform:translateX(-2px)}
}
.subtitle{margin-top:8px;font-size:11px;letter-spacing:.5em;text-indent:.5em;color:var(--dim);
  font-family:Consolas,monospace}
.subtitle .b{color:var(--cyan)}

/* ================= 模式切换 ================= */
.mode-switch{display:flex;gap:10px;position:relative;z-index:1}
.mode-btn{background:linear-gradient(180deg,#0e2a3f,#081725);border:1px solid #1e4a6b;color:var(--dim);
  text-transform:uppercase;letter-spacing:.18em;padding:8px 20px;font-size:12px;cursor:pointer;
  transition:.15s;font-family:Consolas,monospace}
.mode-btn:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.3)}
.mode-btn.sel{color:#02131c;background:linear-gradient(90deg,#00b8d9,#0084ff);font-weight:700;
  border-color:#38e4ff;box-shadow:0 0 16px rgba(0,200,255,.45)}
.multi-actions{display:flex;gap:14px;position:relative;z-index:1;margin-top:10px;display:none}
/* 多球布局：3 球一行 / 4 球 2×2 */
.select-body.multi{display:grid;gap:12px;width:min(1220px,96vw);align-items:stretch}
.select-body.multi[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.select-body.multi[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.select-body.multi .panel{width:100%;padding:14px 16px}
.select-body.multi .preview-wrap{display:none}
.select-body.multi .psec:last-child .cards{max-height:300px}
.select-body.multi .panel:nth-child(1) .pnum{background:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.6)}
.select-body.multi .panel:nth-child(2) .pnum{background:var(--magenta);box-shadow:0 0 12px rgba(255,45,120,.6)}
.select-body.multi .panel:nth-child(3) .pnum{background:var(--green);box-shadow:0 0 12px rgba(61,255,158,.6)}
.select-body.multi .panel:nth-child(4) .pnum{background:#a44dff;box-shadow:0 0 12px rgba(164,77,255,.6)}

/* ================= 选择屏 ================= */
#screen-select{justify-content:flex-start;padding-top:16px;gap:12px;overflow-y:auto;scrollbar-width:thin}
#screen-select::-webkit-scrollbar{width:9px}
#screen-select::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#0e3a5c,#12233f);border-radius:5px;border:2px solid #04070f}
#select-fx{position:absolute;inset:0;pointer-events:none;z-index:0}
.select-body{display:flex;gap:30px;align-items:stretch;position:relative;z-index:1}
.panel{position:relative;width:560px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(120% 80% at 50% 0%,rgba(0,229,255,.07),transparent 55%),
             linear-gradient(180deg,rgba(13,24,44,.95),rgba(6,10,20,.95));
  border:1px solid var(--line);backdrop-filter:blur(2px);
  box-shadow:0 0 34px rgba(0,229,255,.07),inset 0 0 44px rgba(0,0,0,.55)}
.panel::before,.panel::after{content:"";position:absolute;width:24px;height:24px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);
  box-shadow:-2px -2px 8px rgba(0,229,255,.35)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--magenta);border-right:2px solid var(--magenta);
  box-shadow:2px 2px 8px rgba(255,45,120,.35)}
.panel-flux{position:absolute;top:0;left:0;right:0;height:2px;opacity:.75;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--cyan) 30%,var(--magenta) 70%,transparent);
  background-size:220% 100%;animation:fluxMove 2.8s linear infinite}
@keyframes fluxMove{from{background-position:220% 0}to{background-position:-220% 0}}
.panel-head{display:flex;align-items:center;gap:10px}
.pnum{font-size:11px;letter-spacing:.2em;color:#02131c;font-weight:800;padding:3px 8px;border-radius:2px}
.panel-left .pnum{background:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.6)}
.panel-right .pnum{background:var(--magenta);box-shadow:0 0 12px rgba(255,45,120,.6)}
.pname-input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--text);
  font-size:16px;letter-spacing:.12em;padding:4px 2px;outline:none;font-family:Consolas,monospace}
.pname-input:focus{border-bottom-color:var(--cyan)}
.preview-wrap{display:flex;justify-content:center}
.preview-wrap canvas{width:160px;height:160px}
.psec{display:flex;flex-direction:column;gap:10px}
.seclabel{font-size:11px;letter-spacing:.3em;color:var(--dim);display:flex;align-items:center;gap:10px}
.seclabel::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(27,42,68,.9),transparent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.14);cursor:pointer;transition:.14s;position:relative}
.swatch:hover{transform:scale(1.15);border-color:rgba(255,255,255,.6);box-shadow:0 0 14px currentColor}
.swatch.sel{border-color:#fff;box-shadow:0 0 14px currentColor,0 0 26px rgba(255,255,255,.15);transform:scale(1.12)}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.psec:last-child .cards{max-height:380px;overflow-y:auto;padding-right:8px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
          mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.psec:last-child .cards::-webkit-scrollbar{width:8px}
.psec:last-child .cards::-webkit-scrollbar-track{background:rgba(10,20,36,.6)}
.psec:last-child .cards::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#0e4a6e,#1e4a6b);border-radius:4px}
.card{position:relative;width:120px;min-height:132px;padding:10px 8px 9px;border:1px solid #16283f;
  background:linear-gradient(180deg,rgba(13,26,48,.92),rgba(6,12,24,.94));cursor:pointer;
  text-align:center;transition:transform .16s,border-color .16s,box-shadow .16s;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.3;transition:opacity .16s}
.card:hover{transform:translateY(-3px);border-color:rgba(0,229,255,.65);
  box-shadow:0 0 18px rgba(0,229,255,.22),0 8px 26px rgba(0,0,0,.55)}
.card:hover::before{opacity:1}
.card.sel{border-color:var(--cyan);
  box-shadow:0 0 16px rgba(0,229,255,.45),inset 0 0 16px rgba(0,229,255,.1);
  animation:cardPulse 1.6s ease-in-out infinite alternate}
.card.sel::before{opacity:1}
.card.sel::after{content:"";position:absolute;left:0;right:0;height:70%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,229,255,.14),transparent);
  animation:cardScan 2.6s linear infinite}
@keyframes cardScan{from{top:-70%}to{top:110%}}
@keyframes cardPulse{from{box-shadow:0 0 12px rgba(0,229,255,.35),inset 0 0 12px rgba(0,229,255,.08)}
  to{box-shadow:0 0 24px rgba(0,229,255,.6),inset 0 0 20px rgba(0,229,255,.14)}}
.card canvas{width:58px;height:58px;filter:drop-shadow(0 0 6px rgba(0,229,255,.35))}
.card .cname{font-size:13px;color:#bfe4ff;letter-spacing:.06em;line-height:1.25}
.atype{font-size:10px;padding:1px 6px;border-radius:2px;vertical-align:1px;font-family:Consolas,monospace;margin-left:3px}
.atype.melee{color:var(--amber);background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.5);
  box-shadow:0 0 8px rgba(255,176,32,.25)}
.atype.ranged{color:var(--cyan);background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.5);
  box-shadow:0 0 8px rgba(0,229,255,.25)}
.card .cdesc{font-size:10.5px;color:var(--dim);line-height:1.4}

/* VS 列 */
.vs-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-width:150px}
.vs{position:relative;font-size:64px;font-weight:900;font-style:italic;
  background:linear-gradient(180deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,45,120,.5));animation:vsPulse 1.6s ease-in-out infinite alternate}
@keyframes vsPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.vs::before{content:"";position:absolute;inset:-16px;pointer-events:none;opacity:.55;
  border:1px solid rgba(0,229,255,.4);
  clip-path:polygon(0 0,100% 0,100% 20px,20px 20px,20px 100%,0 100%);
  animation:vsFrame 2.2s ease-in-out infinite alternate}
@keyframes vsFrame{from{opacity:.18;box-shadow:0 0 6px rgba(0,229,255,.3)}to{opacity:.75;box-shadow:0 0 18px rgba(0,229,255,.55)}}
.vs-line{width:1px;height:120px;background:linear-gradient(180deg,transparent,var(--line),transparent)}
.vs-btn{width:130px}

/* ================= 按钮 ================= */
.btn{background:linear-gradient(180deg,#0e2a3f,#081725);border:1px solid #1e4a6b;color:var(--cyan);
  text-transform:uppercase;letter-spacing:.18em;padding:12px 22px;font-size:13px;cursor:pointer;
  transition:.15s;font-family:Consolas,monospace;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-80%;width:45%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg);transition:left .55s ease}
.btn:hover{box-shadow:0 0 18px rgba(0,229,255,.35);border-color:var(--cyan);transform:translateY(-1px)}
.btn:hover::after{left:135%}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:linear-gradient(90deg,#00b8d9,#0084ff);color:#02131c;font-weight:700;border-color:#38e4ff;
  animation:btnPulse 2s ease-in-out infinite alternate}
@keyframes btnPulse{from{box-shadow:0 0 10px rgba(0,200,255,.28)}to{box-shadow:0 0 26px rgba(0,200,255,.6)}}
.btn.primary:hover{box-shadow:0 0 30px rgba(0,200,255,.7)}
.btn.ghost{background:transparent}

/* ================= 转场屏 ================= */
#screen-transition{background:#02040a;z-index:50}
.trans-grid{position:absolute;inset:0;opacity:.55;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,229,255,.09) 1px,transparent 1px);
  background-size:52px 52px;animation:gridZoom 1.2s ease-in-out infinite alternate}
@keyframes gridZoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.trans-glitch{position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,229,255,.12) 6px 7px,transparent 7px 23px,
    rgba(255,45,120,.08) 23px 24px,transparent 24px 40px);
  animation:glitchSlide .5s steps(3) infinite}
@keyframes glitchSlide{0%{transform:translateY(0)}50%{transform:translateY(14px)}100%{transform:translateY(0)}}
.trans-inner{display:flex;flex-direction:column;align-items:center;gap:26px;z-index:2}
.trans-title{font-size:32px;letter-spacing:.35em;text-indent:.35em;color:var(--cyan);
  font-family:Consolas,monospace;font-weight:700;text-shadow:0 0 22px rgba(0,229,255,.85);
  animation:transBlink .85s steps(2) infinite}
@keyframes transBlink{50%{opacity:.35}}
.trans-log{font-size:12px;color:#8fb4d8;font-family:Consolas,monospace;white-space:pre;line-height:1.9;
  min-height:96px;text-shadow:0 0 8px rgba(0,229,255,.4)}
.trans-bar{width:430px;height:10px;border:1px solid var(--cyan);padding:2px;
  box-shadow:0 0 14px rgba(0,229,255,.3),inset 0 0 8px rgba(0,229,255,.15)}
.trans-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#0060ff);
  box-shadow:0 0 10px var(--cyan);transition:width .12s linear}
.trans-pct{font-size:13px;color:var(--dim);font-family:Consolas,monospace;letter-spacing:.3em}

/* ================= 战斗屏 ================= */
#screen-battle{background:transparent}
#battle-canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5}
.hud-side{position:absolute;width:280px;display:flex;flex-direction:column;gap:6px}
.hud-side.tl{top:18px;left:34px}
.hud-side.tr{top:18px;right:34px;align-items:flex-end;text-align:right}
.hud-side.bl{bottom:74px;left:34px}
.hud-side.br{bottom:74px;right:34px;align-items:flex-end;text-align:right}
.hud-name{font-size:15px;letter-spacing:.18em;font-family:Consolas,monospace;font-weight:700;text-shadow:0 0 10px currentColor}
.hud-type{font-size:10px;letter-spacing:.28em;font-family:Consolas,monospace;color:var(--dim);margin-top:2px}
.hud-job{font-size:13px;letter-spacing:.22em;font-family:Consolas,monospace;font-weight:700;text-shadow:0 0 8px currentColor;margin-top:2px}
.hpbar{width:100%;height:13px;border:1px solid #1e3a5c;background:#04101e;position:relative;overflow:hidden}
.hpnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:Consolas,monospace;color:#fff;text-shadow:0 0 4px #000,0 0 6px rgba(0,0,0,.8);z-index:2;letter-spacing:.1em}
.hud-status{font-size:10px;font-family:Consolas,monospace;color:#ffd050;min-height:12px;letter-spacing:.05em}
.hpbar::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,255,255,.05) 14px 15px)}
.hpfill{height:100%;width:100%;transition:width .18s ease-out;
  background:linear-gradient(90deg,#00c8e5,#7df3ff);box-shadow:0 0 8px rgba(0,229,255,.5)}
.hud-side.right .hpfill{background:linear-gradient(90deg,#ff7f9e,#ff2d55);box-shadow:0 0 8px rgba(255,45,120,.5)}
.hpfill.dmg{animation:hpFlash .25s}
@keyframes hpFlash{0%{filter:brightness(3)}100%{filter:brightness(1)}}
.cdrow{display:flex;align-items:center;gap:8px;width:100%}
.hud-side.right .cdrow{flex-direction:row-reverse}
.cd-icon{width:24px;height:24px;border:1px solid #1e3a5c;background:#04101e;display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--amber);flex:none}
.cdicon-flash{animation:cdFlash .4s}
@keyframes cdFlash{0%{box-shadow:0 0 16px var(--amber);border-color:var(--amber)}100%{box-shadow:none}}
.cdtrack{flex:1;height:5px;background:#04101e;border:1px solid #16283f}
.cdfill{height:100%;width:0%;background:var(--amber);box-shadow:0 0 6px rgba(255,176,32,.7)}
.railrow{display:none}
.rail-icon{font-size:10px;width:12px;text-align:center;flex:none}
.railfill{height:100%;width:0%;box-shadow:0 0 6px currentColor}
.hud-mid{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.hud-time{font-family:Consolas,monospace;font-size:17px;color:#dfeeff;letter-spacing:.15em;text-shadow:0 0 8px rgba(0,229,255,.6)}
.hud-vs{font-size:11px;color:var(--dim);letter-spacing:.4em}
.corner-btn{position:absolute;bottom:18px;z-index:6;width:44px;height:44px;font-size:16px;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:2px}
#btn-pause{right:74px}
#btn-sound{right:18px}
#pause-overlay{position:absolute;inset:0;background:rgba(2,6,14,.75);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:10}
#pause-overlay.on{display:flex}
#pause-overlay span{font-size:40px;letter-spacing:.5em;text-indent:.5em;color:var(--cyan);
  font-family:Consolas,monospace;text-shadow:0 0 30px rgba(0,229,255,.8);animation:transBlink 1.1s steps(2) infinite}

/* ================= 结算屏 ================= */
#screen-result{background:rgba(2,5,12,.82);backdrop-filter:blur(4px);z-index:40}
#fx-canvas{position:absolute;inset:0;width:100%;height:100%}
.result-inner{display:flex;flex-direction:column;align-items:center;gap:16px;z-index:2}
.result-tag{font-size:12px;letter-spacing:.6em;text-indent:.6em;color:var(--dim);font-family:Consolas,monospace;
  animation:transBlink 1s steps(2) infinite}
.result-title{font-size:52px;font-weight:900;letter-spacing:.22em;text-indent:.22em;
  text-shadow:0 0 30px currentColor;animation:titlePulse 1.4s ease-in-out infinite alternate}
#result-canvas{width:200px;height:200px;animation:floaty 2.2s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-6px) rotate(-4deg)}to{transform:translateY(6px) rotate(4deg)}}
.result-sub{font-size:13px;color:var(--dim);font-family:Consolas,monospace;letter-spacing:.14em}
.result-btns{display:flex;gap:16px;margin-top:10px}
/* ================= 手机/窄屏适配（置于末尾确保覆盖；断点 1340 覆盖小窗口/平板，桌面 1366+ 保持原布局） ================= */
@media (max-width: 1340px) {
  .title{font-size:26px}
  .subtitle{font-size:9px}
  #screen-select{padding-top:10px;gap:8px}
  .select-body{flex-direction:column;gap:10px;align-items:center}
  .panel{width:min(520px,94vw);padding:12px}
  .vs-col{flex-direction:row;min-width:0;gap:10px}
  .vs{font-size:30px}
  .vs-line{width:70px;height:1px}
  .vs-btn{width:110px;padding:8px 10px;font-size:11px}
  .preview-wrap canvas{width:110px;height:110px}
  .card{width:calc(25% - 8px);min-width:88px;min-height:118px;padding:7px 4px}
  .card canvas{width:44px;height:44px}
  .card .cname{font-size:11px}
  .card .cdesc{font-size:9px}
  .psec:last-child .cards{max-height:230px}
  .swatch{width:30px;height:30px}
  /* 战斗 HUD 窄屏 */
  .hud-side{width:34%}
  .hud-name{font-size:11px}
  .hud-type{font-size:8px}
  .hud-time{font-size:13px}
  .hud-status{font-size:9px}
  #hud{padding:10px 12px}
  .corner-btn{width:36px;height:36px;font-size:13px}
  #btn-pause{right:56px}
  #btn-sound{right:10px}
}
</style>
</head>
<body>

// ---------------- 音效 ----------------
let audioOn = true, AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function tone(f0, f1, dur, type, vol) {
  if (!audioOn) return;
  try {
    const c = ac(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* 忽略音频错误 */ }
}
function noiseBurst(dur, vol, freq) {
  if (!audioOn) return;
  try {
    const c = ac(), t = c.currentTime;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  } catch (e) { /* 忽略 */ }
}
function sfx(kind) {
  switch (kind) {
    case 'ui':        tone(880, 880, .06, 'sine', .06); break;
    case 'clash':     noiseBurst(.16, .30, 1400); tone(160, 40, .14, 'square', .10); break;
    case 'hit':       noiseBurst(.10, .18, 2200); tone(300, 90, .10, 'sawtooth', .07); break;
    case 'pulse':     tone(220, 60, .4, 'sine', .22); break;
    case 'shield':    tone(320, 640, .22, 'sine', .14); break;
    case 'shieldBrk': noiseBurst(.22, .25, 900); tone(900, 140, .18, 'square', .09); break;
    case 'phantom':   tone(500, 900, .2, 'triangle', .09); break;
    case 'missile':   tone(1400, 320, .3, 'sawtooth', .06); break;
    case 'rush':      tone(120, 520, .3, 'sawtooth', .11); break;
    case 'repair':    tone(700, 1100, .25, 'sine', .07); break;
    case 'boomerang': tone(400, 900, .25, 'triangle', .09); break;
    case 'railgun':   tone(1800, 90, .5, 'sawtooth', .16); break;
    case 'frost':     tone(900, 1400, .3, 'sine', .1); break;
    case 'barrier':   tone(300, 500, .3, 'square', .08); break;
    case 'nest':      tone(500, 700, .2, 'triangle', .09); break;
    case 'echo':      tone(600, 1200, .3, 'sine', .08); break;
    case 'sonic':     tone(120, 60, .4, 'sawtooth', .14); break;
    case 'fang':      tone(1000, 500, .15, 'triangle', .07); break;
    case 'launcher':  tone(300, 900, .25, 'sawtooth', .12); break;
    case 'tornado':   noiseBurst(.3, .2, 500); tone(200, 80, .4, 'sine', .1); break;
    case 'web':       tone(700, 300, .2, 'triangle', .08); break;
    case 'volcano':   noiseBurst(.4, .3, 300); tone(90, 40, .5, 'sawtooth', .14); break;
    case 'venom':     tone(400, 150, .3, 'sawtooth', .09); break;

    case 'star':      tone(1200, 1800, .2, 'sine', .07); break;
    case 'tsunami':   noiseBurst(.45, .25, 400); tone(300, 90, .45, 'sine', .12); break;
    case 'spore':     tone(300, 200, .25, 'triangle', .08); break;
    case 'clone':     tone(600, 900, .25, 'sine', .08); break;
    case 'evolve':    tone(400, 800, .3, 'triangle', .1); break;
    case 'lance':     tone(200, 900, .35, 'sawtooth', .13); break;
    case 'curse':     tone(320, 980, .3, 'sawtooth', .12); noiseBurst(.12, .2, 2000); break;
    case 'corrode':   noiseBurst(.3, .2, 700); tone(500, 200, .35, 'sawtooth', .08); break;
    case 'coffin':    tone(150, 420, .4, 'triangle', .1); noiseBurst(.2, .15, 500); break;
    case 'tech1':     tone(1800, 700, .15, 'square', .08); break;
    case 'tech2':     tone(2400, 900, .12, 'square', .07); break;
    case 'techx':     tone(2000, 500, .3, 'sine', .1); break;

    case 'win':       [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, .22, 'triangle', .12), i * 130)); break;
  }
}

  });
}

// 按当前模式重建选择面板（2P: 左右 + VS 列；3P/4P: 网格 + 底部按钮）
function buildPanels() {
  const body = $('#select-body');
  body.innerHTML = '';
  const keys = panelKeys(gameMode);
  const multi = gameMode > 2;
  body.className = 'select-body' + (multi ? ' multi' : '');
  if (multi) body.dataset.n = String(gameMode);
  keys.forEach((k, i) => {
    const el = document.createElement('div');
    el.className = 'panel' + (k === 'left' ? ' panel-left' : k === 'right' ? ' panel-right' : '');
    el.id = 'panel-' + k;
    body.appendChild(el);
    buildPanel(k, i);
  });
  if (!multi) {
    const vs = document.createElement('div');
    vs.className = 'vs-col';
    vs.innerHTML = `
      <div class="vs">VS</div>
      <div class="vs-line"></div>
      <button class="btn vs-btn" id="btn-random">⚄ 随机配置</button>
      <button class="btn primary vs-btn" id="btn-start">▶ 启动战斗</button>`;
    body.insertBefore(vs, body.children[1]);
    $('#btn-random').onclick = randomizeAll;
    $('#btn-start').onclick = startGame;
  }
  $('#multi-actions').style.display = multi ? 'flex' : 'none';
  document.querySelectorAll('#mode-switch .mode-btn').forEach(b => b.classList.toggle('sel', +b.dataset.mode === gameMode));
  keys.forEach(k => renderPreview(k));
}

// ---------------- 选择屏星尘粒子背景 ----------------
(function () {
  const cv = document.getElementById('select-fx');
  if (!cv || typeof requestAnimationFrame === 'undefined') return;
  const g = cv.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const resize = () => {
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  resize();
  addEventListener('resize', resize);
  const parts = [];
  for (let i = 0; i < 52; i++) parts.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 1.7 + .3,
    vx: (Math.random() - .5) * .16, vy: (Math.random() - .5) * .1 + .04,
    ph: Math.random() * TAU, sp: Math.random() * 1.1 + .35
  });
  (function loop(t) {
    requestAnimationFrame(loop);
    if (state !== 'select') return;
    g.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -5) p.x = W + 5; else if (p.x > W + 5) p.x = -5;
      if (p.y < -5) p.y = H + 5; else if (p.y > H + 5) p.y = -5;
      const tw = .5 + .5 * Math.sin(t / 1000 * p.sp + p.ph);
      const a = (.12 + .3 * tw) * .8;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU);
      g.fillStyle = 'rgba(150,225,255,' + a.toFixed(3) + ')';
      g.fill();
      if (p.r > 1.15) {
        g.strokeStyle = 'rgba(0,229,255,' + (a * .45).toFixed(3) + ')';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(p.x - p.r * 3.2, p.y); g.lineTo(p.x + p.r * 3.2, p.y);
        g.moveTo(p.x, p.y - p.r * 3.2); g.lineTo(p.x, p.y + p.r * 3.2);
        g.stroke();
      }
    }
  })(0);
})();

function readConfig(side) {
  const pid = 'panel-' + side;
  const p = $('#' + pid);
  const idx = panelKeys(gameMode).indexOf(side);
  const cIdx = [...p.querySelectorAll('.swatch')].findIndex(x => x.classList.contains('sel'));
  const dIdx = [...p.querySelectorAll('#dc-' + side + ' .card')].findIndex(x => x.classList.contains('sel'));
  const aIdx = [...p.querySelectorAll('#ab-' + side + ' .card')].findIndex(x => x.classList.contains('sel'));
  return {
    name: $('#pname-' + side).value.trim() || (DEFAULT_NAMES[idx] || 'PLAYER-' + (idx + 1)),
    color: COLORS[Math.max(0, cIdx)],
    decor: DECORS[Math.max(0, dIdx)].id,
    ability: ABILITIES[Math.max(0, aIdx)].id,
  };
}

function renderPreview(side) {
  const cfg = readConfig(side);
  const cv = $('#preview-' + side);
  const g = cv.getContext('2d');
  g.clearRect(0, 0, 160, 160);
  // 底座光环
  g.strokeStyle = 'rgba(0,229,255,.22)'; g.lineWidth = 1;
  g.beginPath(); g.arc(80, 80, 58, 0, TAU); g.stroke();
  drawOrb(g, { x: 80, y: 80, r: 52, angle: performance.now() / 900, color: cfg.color, decor: cfg.decor, history: null, shieldT: 0, rushT: 0, flash: 0 }, performance.now() / 1000);
}

function randomizeAll() {
  const pick = (arr, exclude) => {
    let v = arr[Math.floor(Math.random() * arr.length)];
    let guard = 0;
    while (exclude && exclude.includes(v.id) && guard++ < 20) v = arr[Math.floor(Math.random() * arr.length)];
    return v;
  };
  const keys = panelKeys(gameMode);
  const usedC = [], usedD = [], usedA = [];
  keys.forEach((side, i) => {
    const c = pick(COLORS.map(c => ({ ...c, id: c.name })), usedC);
    const d = pick(DECORS, usedD);
    const a = pick(ABILITIES, usedA);
    usedC.push(c.id); usedD.push(d.id); usedA.push(a.id);
    const p = $('#' + 'panel-' + side);
    [...p.querySelectorAll('.swatch')].forEach((x, i2) => x.classList.toggle('sel', COLORS[i2].name === c.name));
    [...p.querySelectorAll('#dc-' + side + ' .card')].forEach((x, i2) => x.classList.toggle('sel', DECORS[i2].id === d.id));
    [...p.querySelectorAll('#ab-' + side + ' .card')].forEach((x, i2) => x.classList.toggle('sel', ABILITIES[i2].id === a.id));
    renderPreview(side);
  });
  sfx('ui');
}

// 启动战斗：读取全部面板配置 → 转场
function startGame() {
  players = {};
  for (const k of panelKeys(gameMode)) players[k] = readConfig(k);
  startTransition();
}

// ---------------- 装饰绘制 ----------------
function drawDecRing(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.angle);
  ctx.strokeStyle = o.color.bright; ctx.lineWidth = Math.max(1.6, o.r * .05); ctx.globalAlpha = .85;
  ctx.setLineDash([o.r * .24, o.r * .16]); ctx.lineDashOffset = -o.angle * 22;
  ctx.beginPath(); ctx.arc(0, 0, o.r * 1.14, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = .4; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, o.r * 1.28, 0, TAU); ctx.stroke();
  // 沿环飞行的能量亮点
  for (let i = 0; i < 3; i++) {
    const a = o.angle * 2 + i * TAU / 3;
    ctx.globalAlpha = .95;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(Math.cos(a) * o.r * 1.14, Math.sin(a) * o.r * 1.14, Math.max(1.5, o.r * .05), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawDecSpike(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.angle);
  const w = Math.max(4, o.r * .24), h = Math.max(9, o.r * .34);
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate(i / 6 * TAU);
    ctx.fillStyle = o.color.bright;
    ctx.globalAlpha = .95;
    ctx.beginPath(); ctx.moveTo(o.r * 1.02, 0); ctx.lineTo(o.r * 1.02 + h, -w); ctx.lineTo(o.r * 1.02 + h, w); ctx.closePath(); ctx.fill();
    // 尖端白点（平面点缀）
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.arc(o.r * 1.02 + h * .55, 0, Math.max(1, o.r * .04), 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawDecStripe(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.angle);
  ctx.beginPath(); ctx.arc(0, 0, o.r * .92, 0, TAU); ctx.clip();
  const off = (o.angle * o.r * .8) % (o.r * .8); // 随旋转流动的条纹
  ctx.strokeStyle = o.color.bright; ctx.globalAlpha = .5; ctx.lineWidth = o.r * .3;
  for (let i = -2; i <= 2; i++) {
    const x0 = i * o.r * .85 + off - o.r;
    ctx.beginPath();
    ctx.moveTo(x0, -o.r); ctx.lineTo(x0 + o.r * 1.7, o.r);
    ctx.stroke();
  }
  ctx.globalAlpha = .35; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = o.r * .06;
  for (let i = -2; i <= 2; i++) {
    const x0 = i * o.r * .85 + off - o.r + o.r * .15;
    ctx.beginPath();
    ctx.moveTo(x0, -o.r); ctx.lineTo(x0 + o.r * 1.7, o.r);
    ctx.stroke();
  }
  ctx.restore();
}
function drawDecHex(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.angle);
  const hex = (Rr, rot) => {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + rot;
      const px = Math.cos(a) * Rr, py = Math.sin(a) * Rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  };
  ctx.globalAlpha = .95; ctx.strokeStyle = o.color.bright; ctx.lineWidth = 2;
  hex(o.r * .55, 0); ctx.stroke();
  ctx.globalAlpha = .6; ctx.lineWidth = 1.4;
  hex(o.r * .42, o.angle * .6); ctx.stroke(); // 内层反向旋转
  // 内外连接线
  ctx.globalAlpha = .5; ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * o.r * .42, Math.sin(a) * o.r * .42);
    ctx.lineTo(Math.cos(a) * o.r * .55, Math.sin(a) * o.r * .55);
    ctx.stroke();
  }
  // 中心脉动
  ctx.globalAlpha = .8 + .2 * Math.sin(o.angle * 3);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawDecCross(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.angle * .5);
  ctx.strokeStyle = o.color.bright; ctx.lineWidth = 1.8; ctx.globalAlpha = .95;
  ctx.beginPath(); ctx.moveTo(-o.r * .72, 0); ctx.lineTo(o.r * .72, 0);
  ctx.moveTo(0, -o.r * .72); ctx.lineTo(0, o.r * .72); ctx.stroke();
  // 对角刻度
  ctx.globalAlpha = .6; ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * o.r * .55, Math.sin(a) * o.r * .55);
    ctx.lineTo(Math.cos(a) * o.r * .72, Math.sin(a) * o.r * .72);
    ctx.stroke();
  }
  // 旋转虚线内圈
  ctx.globalAlpha = .7;
  ctx.setLineDash([4, 3]); ctx.lineDashOffset = -o.angle * 12;
  ctx.beginPath(); ctx.arc(0, 0, o.r * .38, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff'; ctx.globalAlpha = .9;
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------------- 球绘制（精美 2D 平面风格） ----------------
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function drawOrb(ctx, o, t) {
  const { x, y, r } = o;
  ctx.save();
  if (o.ghostT > 0) ctx.globalAlpha = .22 + .12 * Math.sin(t * 14); // 幽灵隐身：半透明闪烁
  const R = r * (1 + Math.sin(t * 4 + o.angle) * .02);
  // 尾迹（平面渐隐色带）
  if (o.history && o.history.length > 1) {
    const isTrail = o.decor === 'trail';
    const maxLen = isTrail ? 30 : 12;
    if (o.history.length > maxLen) o.history.splice(0, o.history.length - maxLen);
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < o.history.length; i++) {
      const k = i / o.history.length;
      ctx.globalAlpha = k * (isTrail ? .45 : .2);
      ctx.strokeStyle = o.color.bright;
      ctx.lineWidth = k * (isTrail ? 8 : 3);
      ctx.beginPath();
      ctx.moveTo(o.history[i - 1].x, o.history[i - 1].y);
      ctx.lineTo(o.history[i].x, o.history[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }
  // 平面光晕（柔和衬底）
  ctx.save();
  const glow = ctx.createRadialGradient(x, y, R * .3, x, y, R * 1.5);
  glow.addColorStop(0, hexA(o.color.main, .4));
  glow.addColorStop(1, hexA(o.color.main, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, TAU); ctx.fill();
  ctx.restore();
  // 主体：纯色平面圆
  ctx.fillStyle = o.color.main;
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
  // 平面几何细节：同心环 + 旋转直径线 + 白芯
  ctx.strokeStyle = hexA(o.color.bright, .8);
  ctx.lineWidth = Math.max(1.2, R * .05);
  ctx.beginPath(); ctx.arc(x, y, R * .62, 0, TAU); ctx.stroke();
  ctx.save();
  ctx.translate(x, y); ctx.rotate(o.angle);
  ctx.strokeStyle = hexA(o.color.bright, .5);
  ctx.lineWidth = Math.max(1, R * .035);
  ctx.beginPath(); ctx.moveTo(-R * .85, 0); ctx.lineTo(R * .85, 0); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x, y, R * .17, 0, TAU); ctx.fill();
  // 外圈描边
  ctx.strokeStyle = o.color.bright;
  ctx.lineWidth = Math.max(1.6, R * .07);
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke();
  // 外圈旋转虚线环（平面）
  ctx.save();
  ctx.globalAlpha = .65;
  ctx.setLineDash([R * .22, R * .15]); ctx.lineDashOffset = -o.angle * 30;
  ctx.beginPath(); ctx.arc(x, y, R * 1.09, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  // 狂暴突进提示（红色旋转虚线环）
  if (o.rushT > 0) {
    ctx.save();
    ctx.globalAlpha = .7;
    ctx.strokeStyle = '#ff5060';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([10, 6]); ctx.lineDashOffset = -t * 80;
    ctx.beginPath(); ctx.arc(x, y, R * 1.18, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // 能力底纹（球体底层图案）
  drawAbilityMark(ctx, o, t);
  // 装饰
  const dec = decOf(o.decor);
  if (dec && dec.draw) dec.draw(ctx, o);
  // 护盾（平面圆环）
  if (o.shieldT > 0) {
    ctx.save();
    ctx.fillStyle = hexA(o.color.main, .3);
    ctx.beginPath(); ctx.arc(x, y, R * 1.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.4, R * .045);
    ctx.setLineDash([6, 4]); ctx.lineDashOffset = -t * 70;
    ctx.beginPath(); ctx.arc(x, y, R * 1.2, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // 受击白闪
  if (o.flash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, o.flash / .22);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // V8 液袋：裹身护盾（半透明水袋圈 + 血量刻度）
  if (o.liquidHp > 0) {
    ctx.save();
    ctx.globalAlpha = .5 + .15 * Math.sin(t * 5);
    ctx.strokeStyle = '#7df3ff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#7df3ff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x, y, R * 1.24, 0, TAU); ctx.stroke();
    ctx.globalAlpha = .3;
    ctx.fillStyle = '#7df3ff';
    ctx.beginPath(); ctx.arc(x, y, R * 1.24, 0, TAU); ctx.fill();
    ctx.globalAlpha = .9;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, R * 1.24, -Math.PI / 2, -Math.PI / 2 + TAU * (o.liquidHp / 60)); ctx.stroke();
    ctx.restore();
  }
  // V8 诅咒之钉：被钉住时头顶画钉尖
  if (o.pinned) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#d9c0ff';
    ctx.beginPath(); ctx.moveTo(R * .9, 0); ctx.lineTo(-R * .4, -R * .3); ctx.lineTo(-R * .2, 0); ctx.lineTo(-R * .4, R * .3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-R * .2, 0, R * .14, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---------------- 战斗 ----------------
const battleCanvas = $('#battle-canvas');
const bctx = battleCanvas.getContext('2d');

// ---------------- 多球辅助（V8：支持 2/3/4 球） ----------------
function ownerOf(side) { return battle.orbs.find(o => o.side === side); }
function foesOf(o) { return battle.orbs.filter(x => x !== o && x.alive); }
function nearestFoe(o) {
  let best = null, bd = Infinity;
  for (const f of battle.orbs) {
    if (f === o || !f.alive) continue;
    const d = Math.hypot(f.x - o.x, f.y - o.y);
    if (d < bd) { bd = d; best = f; }
  }
  return best || battle.orbs.find(x => x !== o);
}

function fieldRect() {
  const w = innerWidth, h = innerHeight;
  const s = Math.min(w * .94, h * .84, 720);
  return { x: (w - s) / 2, y: (h - s) / 2 + 6, s };
}
function resizeCanvas() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  battleCanvas.width = innerWidth * dpr;
  battleCanvas.height = innerHeight * dpr;
  battleCanvas.style.width = innerWidth + 'px';
  battleCanvas.style.height = innerHeight + 'px';
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function makeOrb(side, cfg) {

// 战斗 HUD：按模式动态生成四角面板（2P: 左上右上 / 3P: 左上左下右下 / 4P: 四角）
function buildHUD() {
  const hud = $('#hud');
  hud.querySelectorAll('.hud-side').forEach(el => el.remove());
  const n = battle.mode;
  const posOf = side => {
    if (n === 2) return side === 'left' ? 'tl' : 'tr';
    if (n === 3) return side === 'left' ? 'tl' : side === 'right' ? 'bl' : 'br';
    return side === 'left' ? 'tl' : side === 'right' ? 'tr' : side === 'p2' ? 'bl' : 'br';
  };
  battle.orbs.forEach(o => {
    const pos = posOf(o.side);
    const right = pos === 'tr' || pos === 'br';
    const el = document.createElement('div');
    el.className = 'hud-side ' + pos + (right ? ' right' : '');
    el.id = 'hud-side-' + o.side;
    el.innerHTML = `
      <div class="hud-name" id="hud-name-${o.side}">PLAYER</div>
      <div class="hud-type" id="hud-type-${o.side}">近战 MELEE</div>
      <div class="hpbar"><div class="hpfill" id="hp-${o.side}"></div><div class="hpnum" id="hpnum-${o.side}">100%</div></div>
      <div class="hud-job" id="hud-job-${o.side}"></div>
      <div class="hud-status" id="hud-status-${o.side}"></div>
      <div class="cdrow">
        <div class="cd-icon" id="cd-icon-${o.side}">◉</div>
        <div class="cdtrack"><div class="cdfill" id="cd-${o.side}"></div></div>
      </div>
      <div class="cdrow railrow" id="railrow-${o.side}">
        <div class="rail-icon" style="color:#ffd0ff">◎</div>
        <div class="cdtrack"><div class="railfill" id="rail2-${o.side}"></div></div>
        <div class="rail-icon" style="color:#ffe9a0">≡</div>
        <div class="cdtrack"><div class="railfill" id="rail3-${o.side}"></div></div>
      </div>`;
    hud.insertBefore(el, hud.querySelector('.hud-mid'));
  });
  const vs = $('#hud-vs');
  vs.textContent = n === 2 ? 'VS' : n + 'P 混战';
}

function startBattle() {
  const F = fieldRect();
  const n = gameMode;
  const orbs = [];
  // 面板键：双球沿用 left/right，多球为 p0..p3
  const keys = n === 2 ? ['left', 'right'] : ['p0', 'p1', 'p2', 'p3'].slice(0, n);
  const cfgs = keys.map(k => players[k] || players.left || Object.values(players)[0] || { name: 'P', color: COLORS[0], decor: 'ring', ability: ABILITIES[0].id });
  cfgs.forEach((cfg, i) => {
    const o = makeOrb(i === 0 ? 'left' : i === 1 ? 'right' : 'p' + i, cfg);
    orbs.push(o);
  });
  const sp = 300;
  for (let i = 0; i < n; i++) {
    const o = orbs[i];
    const ang0 = i / n * TAU - Math.PI / 2; // 环形均布（从顶部开始）
    const cx = F.x + F.s / 2, cy = F.y + F.s / 2;
    const rr = F.s * (n === 2 ? .26 : .3);
    o.x = cx + Math.cos(ang0) * rr;
    o.y = cy + Math.sin(ang0) * rr;
    // 外切方向飞行：朝外侧半球（避免开局对冲），随机 ±50°
    const outA = ang0 + rand(-.9, .9);
    o.vx = Math.cos(outA) * sp; o.vy = Math.sin(outA) * sp;
  }
  battle = { orbs, left: orbs[0], right: orbs[1] || null, proj: [], fx: [], structs: [], time: 0, shake: 0, over: false, winner: null, paused: false, ambient: [], mode: n };
  // 场地漂浮粒子（氛围）
  for (let i = 0; i < 36; i++) {
    battle.ambient.push({ x: rand(F.x, F.x + F.s), y: rand(F.y, F.y + F.s), vx: rand(-14, 14), vy: rand(-14, 14), size: rand(1, 2.6), a: rand(.08, .4), ph: rand(0, TAU) });
  }
  buildHUD();
  // HUD 文案
  const typeColor = { melee: '#ffb020', ranged: '#00e5ff' };
  battle.orbs.forEach((o, i) => {
    const sideKey = o.side;
    $('#hud-name-' + sideKey).textContent = o.name;
    $('#hud-name-' + sideKey).style.color = o.color.main;
    $('#hud-type-' + sideKey).textContent = TYPE_LABEL[abOf(o.ability).type];
    $('#hud-type-' + sideKey).style.color = typeColor[abOf(o.ability).type];
    $('#hud-job-' + sideKey).textContent = '◈ ' + abOf(o.ability).name;
    $('#hud-job-' + sideKey).style.color = o.color.bright;
    $('#cd-icon-' + sideKey).textContent = abOf(o.ability).icon;
    $('#hp-' + sideKey).style.width = '100%';
    $('#cd-' + sideKey).style.width = '0%';
  });
  $('#pause-overlay').classList.remove('on');
  resizeCanvas();
  showScreen('battle');
}

function moveOrb(o, dt, foe) {
  const F = fieldRect();
  // 定身（火山喷发）：原地不动，不位移不反弹
  if (o.stunT > 0) {
    o.stunT -= dt;
    o.angle += dt * 1.2;
    return;
  }
  // V8 诅咒之钉：被钉住时位置锁定，随钉子一起飞行（速度同步钉子）
  if (o.pinned) {
    o.x = o.pinned.x; o.y = o.pinned.y;
    o.vx = o.pinned.vx; o.vy = o.pinned.vy;
    o.angle += dt * 2;
    o.history.push({ x: o.x, y: o.y });
    const maxLenP = o.decor === 'trail' ? 30 : 12;
    if (o.history.length > maxLenP) o.history.splice(0, o.history.length - maxLenP);
    return;
  }
  // 纯直线运动：完全随机直线飞行，只有撞击 / 技能命中 / 边界反弹会改变路径（零主动干预）
  // 边界反弹（不可越界）
  const minX = F.x + o.r, maxX = F.x + F.s - o.r;
  const minY = F.y + o.r, maxY = F.y + F.s - o.r;
  const webBounce = (o, axis) => { // 网缚反弹：反弹后速度减半（蛛网）
    if (o.webT > 0) {
      o.webT = 0;
      if (axis === 'x') o.vx *= .5; else o.vy *= .5;
      addText(o.x, o.y - 34, '网缚反弹', '#e8f4ff', 12);
      addSparks(o.x, o.y, 5, '#e8f4ff');
    }
  };
  // V8 撞墙 hook：科技I/II 留激光台 · 拘束留锚 · 棺椁散蝴蝶（在 updateBattle 中消费）
  const onWallHit = (o) => {
    if (o.ability === 'anchor') o.wallHit = { x: o.x, y: o.y };
    if (o.ability === 'tech1' || o.ability === 'tech2') o.techWall = { x: o.x, y: o.y };
    if (o.ability === 'bond') o.bondWall = { x: o.x, y: o.y };
    if (o.ability === 'coffin') o.butterflyWall = { x: o.x, y: o.y };
  };
  const launchBounce = (o) => { // 弹射撞墙：受 2 次近战撞击伤害（发射台强化）
    if (o.launchT > 0) {
      o.launchT = 0;
      hitOrb(o, 16, foe, true, true); // 16 × 1.5 全局 = 24 实伤 ≈ 2 次近战撞击
      addText(o.x, o.y - 40, '弹射撞墙!', '#ffd050', 14);
      addSparks(o.x, o.y, 8, '#ffd050');
      sfx('clash');
    }
  };
  if (o.x < minX) { o.x = minX; o.vx = Math.abs(o.vx); webBounce(o, 'x'); launchBounce(o); onWallHit(o); }
  if (o.x > maxX) { o.x = maxX; o.vx = -Math.abs(o.vx); webBounce(o, 'x'); launchBounce(o); onWallHit(o); }
  if (o.y < minY) { o.y = minY; o.vy = Math.abs(o.vy); webBounce(o, 'y'); launchBounce(o); onWallHit(o); }
  if (o.y > maxY) { o.y = maxY; o.vy = -Math.abs(o.vy); webBounce(o, 'y'); launchBounce(o); onWallHit(o); }
  // 巡航速度回归：速度自然衰减回类型巡航速度（狂暴突进 > 狂暴 > 连击层数 > 拘束锚点 > 远程；被撞后逃脱加速）
  const comboSpd = (o.ability === 'combo' && o.comboN > 0) ? (1 + o.comboN * .045 * (o.comboX > 0 ? 2 : 1)) : 1;
  const bondSpd = (o.ability === 'bond' && o.bondPts.length > 0) ? (1 + o.bondPts.length * .08) : 1; // 拘束：锚点越多越快
  const cruise = 300 * (o.rushT > 0 ? 2.2 : 1) * comboSpd * bondSpd;
  const spd = Math.hypot(o.vx, o.vy);
  const ns = spd + (cruise - spd) * Math.min(1, dt * 1.5);
  if (spd > .001) { o.vx = o.vx / spd * ns; o.vy = o.vy / spd * ns; }
  // 骑枪冲刺：每帧把速度大小强制为 900（方向保持当前，撞墙反弹后继续朝新方向）
  if (o.lanceT > 0) {
    const spd2 = Math.hypot(o.vx, o.vy) || 1;
    const k = 900 / spd2;
    o.vx *= k; o.vy *= k;
  }
  // 位移（减速效果：只降速度不干预方向；腐蚀减速可叠加）
  let slowMult = o.slowT > 0 ? (1 - o.slowPct) : 1;
  if (o.corrodeSlowN > 0) slowMult *= 1 - Math.min(.6, o.corrodeSlowN * .12); // 腐蚀减速：每层 12%，上限 60%
  o.x += o.vx * dt * slowMult;
  o.y += o.vy * dt * slowMult;
  // 位移后 clamp（防高速冲刺/强推单帧越界闪烁）：越界同步翻转速度，保证反弹/网缚/锚点逻辑完整
  if (o.x < minX) { o.x = minX; o.vx = Math.abs(o.vx); webBounce(o, 'x'); launchBounce(o); onWallHit(o); }
  else if (o.x > maxX) { o.x = maxX; o.vx = -Math.abs(o.vx); webBounce(o, 'x'); launchBounce(o); onWallHit(o); }
  if (o.y < minY) { o.y = minY; o.vy = Math.abs(o.vy); webBounce(o, 'y'); launchBounce(o); onWallHit(o); }
  else if (o.y > maxY) { o.y = maxY; o.vy = -Math.abs(o.vy); webBounce(o, 'y'); launchBounce(o); onWallHit(o); }
  o.angle += dt * (1.2 + Math.hypot(o.vx, o.vy) / 260);
  o.history.push({ x: o.x, y: o.y });
  const maxLen = o.decor === 'trail' ? 30 : 12;
  if (o.history.length > maxLen) o.history.splice(0, o.history.length - maxLen);
}

function hitOrb(target, dmg, src, silent, isCollision) {
  if (battle.over) return;
  if (target.invT > 0) { // 无敌（传送门跃迁 2s）
    addText(target.x, target.y - 30, '无敌', '#9ff', 12);
    return;
  }
  if (target.shieldT > 0) { // 护盾挡一次 + 反伤
    target.shieldT = 0;
    addRing(target.x, target.y, 90, '#ffffff', 3);
    addSparks(target.x, target.y, 12, '#ffffff');
    sfx('shieldBrk');
    addText(target.x, target.y - 30, 'BLOCKED', '#9ff');
    if (src && src !== target && src.alive && src.invT <= 0) { // 反伤 10（无敌期不反伤）
      src.hp -= 10;
      addText(src.x, src.y - 30, '反伤', '#ff5060', 13);
      addSparks(src.x, src.y, 6, '#ff5060');
    }
    return;
  }
  dmg *= 1.5; // 全局伤害 +50%
  // 吸血鬼吸身期 90% 庇护：严格 10% 承伤，全部易伤/减伤乘区不叠加（互斥优先）
  if (battle.vamp && battle.vamp.t > 0 && target === battle.vamp.src) {
    dmg *= .1;
  } else {
    if (target.webVulnT > 0) dmg *= 1.75; // 蛛网易伤 +75%（强化）
    if (target.ghostT > 0) dmg *= .5; // 幽灵虚化（隐身）期 50% 庇护
    if (battle.proj.some(p => p.type === 'clone' && p.owner === target.side && p.life > 0)) dmg *= .5; // 替身在场：本体 50% 庇护（V7）
    // 近战球减伤：碰撞 -40%（在 collide 内处理）、远程/技能伤害 -20%
    if (!isCollision && src && abOf(src.ability).type === 'ranged' && abOf(target.ability).type === 'melee') dmg *= .8;
    if (target.frostT > 0 && !isCollision) dmg *= 1.25; // 深度冻结易伤 +25%
    if (target.corrodeN > 0) dmg *= 1 + target.corrodeN * .15; // 腐蚀易伤：每层 +15%（可叠加）
    if (target.vulnT > 0) dmg *= 1.5; // 电线杆落雷易伤 +50%
  }
  if (src && src.atkBonus > 0) dmg += src.atkBonus; // 液袋击破永久增攻（上限 +30）
  // 液袋护盾：伤害先扣液袋血量，击破时永久增攻
  if (target.liquidHp > 0) {
    const absorbed = Math.min(target.liquidHp, dmg);
    target.liquidHp -= absorbed;
    dmg -= absorbed;
    if (target.liquidHp <= 0) {
      target.liquidHp = 0;
      const gain = 5;
      target.atkBonus = Math.min(30, target.atkBonus + gain);
      addRing(target.x, target.y, 60, '#7df3ff', 3);
      addText(target.x, target.y - 44, '液袋击破 · 攻+' + gain, '#7df3ff', 13);
      sfx('shieldBrk');
    }
    if (dmg <= 0) { addSparks(target.x, target.y, 4, '#7df3ff'); return; }
  }
  target.hp -= dmg;
  target.flash = .22;
  const big = dmg >= 22;
  addText(target.x + rand(-8, 8), target.y - 28, '-' + Math.round(dmg), big ? '#ffd050' : target.color.bright, big ? 19 : 16);
  if (!silent) { addSparks(target.x, target.y, 8, target.color.bright); sfx('hit'); }
  battle.shake = Math.min(13, battle.shake + 3.5);
  if (target.hp <= 0 && !battle.over) killOrb(target);
}

function collide(a, b) {
  // 吸血鬼吸身期：跳过碰撞结算（吸身自带 DPS），防止贴墙时每帧反复碰撞判定导致瞬间即死
  if (battle.vamp && battle.vamp.t > 0) return;
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  if (d >= a.r + b.r) return; // 未接触：绝不干预位置（修复"远处瞬移相吸"）
  let nx, ny;
  if (d < 0.001) { // 完全重叠：随机法线 + 无条件分离，解除永久重叠
    const ra = Math.random() * TAU;
    nx = Math.cos(ra); ny = Math.sin(ra);
    const ov = a.r + b.r;
    a.x -= nx * ov / 2; a.y -= ny * ov / 2;
    b.x += nx * ov / 2; b.y += ny * ov / 2;
    return;
  }
  nx = dx / d; ny = dy / d;
  const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
  const dot = dvx * nx + dvy * ny;
  if (dot <= 0) return; // 正在远离
  // 等质量弹性碰撞：交换法线方向速度分量（路径自然改变）
  a.vx -= dot * nx; a.vy -= dot * ny;
  b.vx += dot * nx; b.vy += dot * ny;
  // 位置分离（防重叠）
  const ov = a.r + b.r - d;
  a.x -= nx * ov / 2; a.y -= ny * ov / 2;
  b.x += nx * ov / 2; b.y += ny * ov / 2;
  // 轻微击退（撞击感，不弹飞）：只改速度不瞬移位置，巡航回归会快速收回
  const kick = Math.min(90, Math.abs(dot) * .3);
  b.vx += nx * kick; b.vy += ny * kick;
  a.vx -= nx * kick * .4; a.vy -= ny * kick * .4;
  // 撞击点特效
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  addRing(mx, my, 60, '#ffffff', 2.5);
  addSparks(mx, my, 10, a.color.bright);
  addSparks(mx, my, 10, b.color.bright);
  sfx('clash');
  battle.shake = Math.min(14, battle.shake + 6);
  // 伤害：基础 + 相对速度加成，rush 增伤；近战撞击更疼、远程撞击减伤；连击叠层增伤
  const base = 9, extra = Math.min(10, Math.abs(dot) / 6);
  const comboMult = o => (o.ability === 'combo' && o.comboN > 0) ? (1 + o.comboN * .08 * (o.comboX > 0 ? 2 : 1)) : 1;
  const evolveMult = o => (o.ability === 'evolve' && o.evolveLv > 0) ? (1 + o.evolveLv * .15) : 1;
  const meleeDef = o => abOf(o.ability).type === 'melee' ? .6 : 1; // 近战球碰撞伤害 -40%
  const dmgB = (base + extra + (a.rushT > 0 ? 12 : 0)) * (abOf(a.ability).type === 'melee' ? 1.3 : .5) * comboMult(a) * evolveMult(a) * meleeDef(b); // a 撞 b（rush 增伤 8→12）
  const dmgA = (base + extra + (b.rushT > 0 ? 12 : 0)) * (abOf(b.ability).type === 'melee' ? 1.3 : .5) * comboMult(b) * evolveMult(b) * meleeDef(a); // b 撞 a
  hitOrb(b, dmgB, a, true, true);
  hitOrb(a, dmgA, b, true, true);
  // 新：狂暴突进命中附带减速
  if (a.rushT > 0) { b.slowT = Math.max(b.slowT, .8); b.slowPct = .35; addText(b.x, b.y - 34, '震击减速', '#ff8090', 12); }
  if (b.rushT > 0) { a.slowT = Math.max(a.slowT, .8); a.slowPct = .35; addText(a.x, a.y - 34, '震击减速', '#ff8090', 12); }
  // —— 能力被动效果（撞击触发）——
  if (a.ability === 'burn') b.burnT = Math.max(b.burnT, 5);
  if (b.ability === 'burn') a.burnT = Math.max(a.burnT, 5);
  // 剧毒：主动撞击方给对方叠毒层（上限 5，毒时间 8s）
  if (a.ability === 'venom') { b.venomN = Math.min(5, b.venomN + 1); b.venomT = 8; addText(b.x, b.y - 52, '☣ 毒×' + b.venomN, '#9fe870', 13); }
  if (b.ability === 'venom') { a.venomN = Math.min(5, a.venomN + 1); a.venomT = 8; addText(a.x, a.y - 52, '☣ 毒×' + a.venomN, '#9fe870', 13); }
  // 进化：主动撞击方积累经验（每 3 点升级：体积+20% / 撞击伤害+15%，上限 3 级；进化加速期经验×2）
  if (a.ability === 'evolve') { a.evolveX += (a.evolveBoost > 0 ? 2 : 1); addText(a.x, a.y - 52, '🧬 经验+' + (a.evolveBoost > 0 ? 2 : 1), '#7dffa8', 12); if (a.evolveX >= 3 && a.evolveLv < 3) { a.evolveX = 0; a.evolveLv++; a.r *= 1.2; addRing(a.x, a.y, 70, '#7dffa8', 3); addText(a.x, a.y - 40, '🧬 进化 Lv.' + a.evolveLv, '#7dffa8', 16); sfx('evolve'); } }
  if (b.ability === 'evolve') { b.evolveX += (b.evolveBoost > 0 ? 2 : 1); addText(b.x, b.y - 52, '🧬 经验+' + (b.evolveBoost > 0 ? 2 : 1), '#7dffa8', 12); if (b.evolveX >= 3 && b.evolveLv < 3) { b.evolveX = 0; b.evolveLv++; b.r *= 1.2; addRing(b.x, b.y, 70, '#7dffa8', 3); addText(b.x, b.y - 40, '🧬 进化 Lv.' + b.evolveLv, '#7dffa8', 16); sfx('evolve'); } }
  if (a.ability === 'combo' && b.ability === 'combo') { // 双连击：互清后各自叠层
    a.comboN = Math.min(10, a.comboN + 1);
    b.comboN = Math.min(10, b.comboN + 1);
  } else {
    if (a.ability === 'combo') { a.comboN = Math.min(10, a.comboN + 1); b.comboN = 0; addText(a.x, a.y - 40, '连击×' + a.comboN, '#ffd050', 14); }
    if (b.ability === 'combo') { b.comboN = Math.min(10, b.comboN + 1); a.comboN = 0; addText(b.x, b.y - 40, '连击×' + b.comboN, '#ffd050', 14); }
  }
  if (a.ability === 'vampire' && !battle.vamp && a.vampT <= 0) battle.vamp = { src: a, foe: b, t: 2 };
  if (b.ability === 'vampire' && !battle.vamp && b.vampT <= 0) battle.vamp = { src: b, foe: a, t: 2 };
  if (a.ability === 'split' && a.splitCd <= 0 && b.alive) { // 被撞分裂
    a.splitCd = 3;
    const sa = Math.random() * TAU;
    battle.proj.push({ type: 'shard', owner: a.side, x: a.x + Math.cos(sa) * 85, y: a.y + Math.sin(sa) * 85, vx: Math.cos(sa) * 230, vy: Math.sin(sa) * 230, life: 5, r: 16, color: a.color.bright, hitT: 0, grace: .8 });
    addText(a.x, a.y - 40, '分裂', a.color.bright, 14);
  }
  if (b.ability === 'split' && b.splitCd <= 0 && a.alive) {
    b.splitCd = 3;
    const sa = Math.random() * TAU;
    battle.proj.push({ type: 'shard', owner: b.side, x: b.x + Math.cos(sa) * 85, y: b.y + Math.sin(sa) * 85, vx: Math.cos(sa) * 230, vy: Math.sin(sa) * 230, life: 5, r: 16, color: b.color.bright, hitT: 0, grace: .8 });
    addText(b.x, b.y - 40, '分裂', b.color.bright, 14);
  }
}

// ---------------- 能力 ----------------
// V8 棺椁：随机封锁一个"没有小球存在"的四分之一场景（禁止敌人进入）
function sealCoffinZone(o) {
  const F = fieldRect();
  const h = F.s / 2;
  const quads = [
    { x: F.x, y: F.y, w: h, h },          // 左上
    { x: F.x + h, y: F.y, w: h, h },      // 右上
    { x: F.x, y: F.y + h, w: h, h },      // 左下
    { x: F.x + h, y: F.y + h, w: h, h },  // 右下
  ];

function addFx(f) { battle.fx.push(f); }
function addRing(x, y, r0, color, lw) {
  addFx({ type: 'ring', x, y, r: r0, vr: 380, maxLife: .4, life: 0, color, lw });
}
function addSparks(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rand(60, 320);
    addFx({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, maxLife: rand(.25, .55), size: rand(1.5, 3.2), color });
  }
}
function addText(x, y, text, color, size) {
  addFx({ type: 'text', x, y, text, color, life: 0, maxLife: .8, vy: 46, size: size || 15 });
}
function boom(o) {
  addRing(o.x, o.y, 20, o.color.bright, 5);
  addRing(o.x, o.y, 10, '#ffffff', 4);
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * TAU, sp = rand(90, 480);
    addFx({ type: 'spark', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, maxLife: rand(.5, 1.1), size: rand(2, 4.5), color: Math.random() < .5 ? o.color.bright : '#ffffff' });
  }
  battle.shake = 18;
  sfx('boom');
}

function updateFx(dt) {
  for (const f of battle.fx) {
    f.life += dt;
    if (f.type === 'ring') f.r += f.vr * dt;
    if (f.type === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; }
    if (f.type === 'text') f.y -= f.vy * dt;
  }
  battle.fx = battle.fx.filter(f => f.life < f.maxLife);
}

// 贯穿战场的直线（与矩形求交）
function lineThroughField(cx, cy, ang, F) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let tMin = -Infinity, tMax = Infinity;
  const clip = (p, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) return;
    let t1 = (lo - p) / d, t2 = (hi - p) / d;
    if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; }
    tMin = Math.max(tMin, t1); tMax = Math.min(tMax, t2);
  };
  clip(cx, dx, F.x + 16, F.x + F.s - 16);
  clip(cy, dy, F.y + 16, F.y + F.s - 16);
  return [[cx + tMin * dx, cy + tMin * dy], [cx + tMax * dx, cy + tMax * dy]];
}

// ---------------- 场景实体（新能力系统） ----------------
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function updateStructs(dt) {
  const B = battle, F = fieldRect();
  const L = B.left, R = B.right;
  B.wuliangFuse = false; // 每帧重置：苍赫合成帧级闸（V7 防同帧链式多爆）
  for (const s of B.structs) {
    if (s.dead) continue; // 已标记销毁的实体不再处理（修复苍赫爆炸同帧重复触发）
    if (s.type === 'gravwell') { // 引力阱：中心黑洞，全场强吸扯 + 螺旋吸入粒子 + 无序粒子流伤害
      s.life -= dt;

            ? (B.orbs.reduce((best, o2) => (!o2.alive) ? best : (!best || Math.hypot(o2.x - bx, o2.y - by) < Math.hypot(best.x - bx, best.y - by)) ? o2 : best, null)).side
            : s.owner;
          B.structs.push({ type: 'wulianbi', owner: ownSide, x: bx, y: by, vx: rand(-90, 90), vy: rand(-90, 90), life: 5, r: 30, hitT: 0 });
        }
        battle.shake = 20;
        sfx('boom');
        }
      }
    }
    if (s.type === 'wulianbi') { // 芘：融合太极球，强力吸扯 + 碰撞伤害
      s.life -= dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < F.x + s.r || s.x > F.x + F.s - s.r) s.vx = -s.vx;
      if (s.y < F.y + s.r || s.y > F.y + F.s - s.r) s.vy = -s.vy;
      const owner = ownerOf(s.owner);
      const foe = nearestFoe(ownerOf(s.owner));
      if (foe.alive) {
        const d = Math.hypot(foe.x - s.x, foe.y - s.y);
        if (d > 1 && d < 320) { // 强力吸扯（已增强）
          const k = 360 * dt * (1 - d / 320); // 新：300→360
          foe.vx += (s.x - foe.x) / d * k;
          foe.vy += (s.y - foe.y) / d * k;
        }
        s.hitT -= dt;
        if (d < foe.r + s.r && s.hitT <= 0) {
          s.hitT = .8;
          hitOrb(foe, 15, owner, true); // 新：12→15
          addSparks(s.x, s.y, 8, '#ffffff');
        }
      }
    }
    // —— V4 结构体 ——
    if (s.type === 'web') { // 蛛网：敌方入网减速 + 网缚（反弹减半）+ 75% 易伤
      s.life -= dt;
      const foe = nearestFoe(ownerOf(s.owner));
      if (foe.alive && foe.invT <= 0 && Math.hypot(foe.x - s.x, foe.y - s.y) < foe.r + s.r) {
        s.hitT -= dt;
        if (s.hitT <= 0) {
          s.hitT = .8;
          foe.slowT = Math.max(foe.slowT, 1.2); foe.slowPct = .45;
          foe.webT = 3;
          foe.webVulnT = 2; // 网中易伤 +75%（强化）
          addText(foe.x, foe.y - 40, '缠网·易伤', '#e8f4ff', 13);
          addSparks(foe.x, foe.y, 6, '#e8f4ff');
        }
      }
    }
    if (s.type === 'lavaburst') { // 火山熔岩：扇形曲线延伸，命中减速 + 持续伤害
      s.life -= dt;
      const owner = ownerOf(s.owner);
      const foe = nearestFoe(ownerOf(s.owner));
      for (const seg of s.segs) {
        if (seg.len < s.maxLen) { // 曲线延伸（正弦摆动）
          const sp = 240;
          seg.dir += Math.sin(s.life * 6 + seg.phase) * .9 * dt;
          const last = seg.pts[seg.pts.length - 1];
          const nx = last.x + Math.cos(seg.dir) * sp * dt;
          const ny = last.y + Math.sin(seg.dir) * sp * dt;
          seg.pts.push({ x: nx, y: ny });
          seg.len += sp * dt;
          if (Math.random() < .6) addFx({ type: 'spark', x: nx, y: ny, vx: rand(-20, 20), vy: rand(-30, -10), life: 0, maxLife: .5, size: 2.2, color: '#ff8833' });
        }
        if (foe.alive && foe.invT <= 0 && seg.pts.length >= 2) { // 全段判定（性能无虞，<600 次/帧）
          for (let i = seg.pts.length - 1; i >= 1; i--) {
            const a = seg.pts[i - 1], b = seg.pts[i];
            if (distToSeg(foe.x, foe.y, a.x, a.y, b.x, b.y) < foe.r + 16) {
              s.hitT -= dt;
              if (s.hitT <= 0) {
                s.hitT = .35;
                hitOrb(foe, 4, owner, true);
                foe.slowT = Math.max(foe.slowT, .6); foe.slowPct = .4;
                addSparks(foe.x, foe.y, 4, '#ff8833');
                addText(foe.x, foe.y - 40, '熔岩灼烧', '#ff8833', 12);
              }
              break;
            }
          }
        }
      }
    }
    // —— V5 结构体 ——
    if (s.type === 'tsunami') { // 海啸：波浪条带推进，命中强推位移
      s.life -= dt;
      s.len += s.sp * dt;
      const cx = s.x + Math.cos(s.a) * s.len, cy = s.y + Math.sin(s.a) * s.len;
      if (Math.random() < .8) { // 波浪粒子
        const px = cx + Math.cos(s.a + Math.PI / 2) * rand(-60, 60);
        const py = cy + Math.sin(s.a + Math.PI / 2) * rand(-60, 60);
        addFx({ type: 'spark', x: px, y: py, vx: Math.cos(s.a) * 40 + rand(-20, 20), vy: Math.sin(s.a) * 40 + rand(-20, 20), life: 0, maxLife: .45, size: 3, color: '#9fe8ff' });
      }
      const foe = nearestFoe(ownerOf(s.owner));
      if (foe.alive && foe.invT <= 0 && distToSeg(foe.x, foe.y, s.x, s.y, cx, cy) < foe.r + 190) { // 判定与加宽条带（±185）匹配
        s.hitT -= dt;
        if (s.hitT <= 0) {
          s.hitT = .4; // 命中频率翻倍
          hitOrb(foe, 4, ownerOf(s.owner), true); // 伤害 8→4
          foe.vx += Math.cos(s.a) * 420; foe.vy += Math.sin(s.a) * 420; // 沿波浪方向强推
          addText(foe.x, foe.y - 40, '海啸', '#9fe8ff', 15);
          addSparks(foe.x, foe.y, 8, '#9fe8ff');
          sfx('tsunami');
        }
      }
      if (s.len >= s.maxLen) s.dead = true;
    }
    if (s.type === 'mushroom') { // 毒蘑菇：2s 生长后持续毒域（减速+毒伤）
      s.life -= dt;
      s.growT -= dt;
      const foe = nearestFoe(ownerOf(s.owner));
      if (Math.random() < .35) addFx({ type: 'spark', x: s.x + rand(-20, 20), y: s.y + rand(-20, 20), vx: rand(-12, 12), vy: rand(-24, -6), life: 0, maxLife: .5, size: 2, color: s.growT > 0 ? '#8a9a6a' : '#b8e870' });
      if (s.growT <= 0 && foe.alive && foe.invT <= 0 && Math.hypot(foe.x - s.x, foe.y - s.y) < foe.r + 87) { // 毒域 +50%（58→87）
        s.hitT -= dt;
        if (s.hitT <= 0) {
          s.hitT = .5;
          foe.hp -= 2.5; // 直接毒伤（与 burn DoT 同款）
          foe.slowT = Math.max(foe.slowT, .3); foe.slowPct = .3;
          addText(foe.x, foe.y - 40, '毒菇', '#b8e870', 12);
          addSparks(foe.x, foe.y, 3, '#b8e870');
        }
      }
    }
    // —— V8 结构体 ——
    if (s.type === 'cursefire') { // 诅咒火焰圈：逐渐变大，范围内持续伤害
      s.life -= dt;
      s.r += 46 * dt;
      const owner = ownerOf(s.owner);
      for (const o of B.orbs) {
        if (o === owner || !o.alive || o.invT > 0) continue;
        if (Math.hypot(o.x - s.x, o.y - s.y) < o.r + s.r) {
          s.hitT -= dt;
          if (s.hitT <= 0) {
            s.hitT = .3;
            hitOrb(o, 6, owner, true);
            addSparks(o.x, o.y, 4, '#c07aff');
          }
        }
      }
    }
    if (s.type === 'laserturret') { // 激光发射器：独立发射 cd
      s.life -= dt;
      s.fireT -= dt;
      if (s.fireT <= 0) {
        s.fireT = s.cd;
        const foe = nearestFoe(ownerOf(s.owner));
        if (foe && foe.alive) {
          const a = Math.atan2(foe.y - s.y, foe.x - s.x);
          B.proj.push({ type: 'laserbolt', owner: s.owner, x: s.x, y: s.y, vx: Math.cos(a) * 700, vy: Math.sin(a) * 700, life: .9, r: 4, dmg: s.dmg });
          addSparks(s.x, s.y, 2, '#6fe8ff');
          if (Math.random() < .3) sfx('tech1');
        }
      }
    }
    if (s.type === 'lightning') { // 电线杆落雷：无前摇瞬发（伤害 + 定身 + 易伤）
      s.delay -= dt;
      if (s.delay <= 0) {
        const owner = ownerOf(s.owner);
        addFx({ type: 'ring', x: s.x, y: s.y, r: 14, vr: 560, maxLife: .45, life: 0, color: '#ffd050', lw: 4 });
        addFx({ type: 'blade', x1: s.x, y1: s.y - 220, x2: s.x, y2: s.y + 220, life: 0, maxLife: .18, color: '#fff6c0' });
        for (let i = 0; i < 18; i++) {
          const a = Math.random() * TAU, sp = rand(80, 380);
          addFx({ type: 'spark', x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, maxLife: .5, size: 3, color: '#ffd050' });
        }
        battle.shake = Math.min(14, battle.shake + 6);
        sfx('pylon');
        for (const o of B.orbs) {
          if (o === owner || !o.alive || o.invT > 0) continue;
          if (Math.hypot(o.x - s.x, o.y - s.y) < o.r + s.r) {
            hitOrb(o, 14, owner, true);
            o.stunT = Math.max(o.stunT, 1.1); // 定身
            o.vulnT = Math.max(o.vulnT, 3); // 易伤 +50%
            addText(o.x, o.y - 40, '⚡ 定身·易伤', '#ffd050', 14);
            addSparks(o.x, o.y, 8, '#ffd050');
          }
        }
        s.dead = true;
      }
    }
    if (s.type === 'coffinzone') { // 棺椁封锁区：禁止敌人进入（接触反弹 + 小伤）
      s.life -= dt;
      const owner = ownerOf(s.owner);
      for (const o of B.orbs) {
        if (o.side === s.owner || !o.alive || o.invT > 0) continue;
        if (o.x > s.x && o.x < s.x + s.w && o.y > s.y && o.y < s.y + s.h) {
          const dx = o.x - (s.x + s.w / 2), dy = o.y - (s.y + s.h / 2);
          const d = Math.hypot(dx, dy) || 1;
          const nx = dx / d, ny = dy / d;
          o.x += nx * 16; o.y += ny * 16;
          const dot = o.vx * nx + o.vy * ny;
          if (dot < 0) { o.vx -= 2 * dot * nx; o.vy -= 2 * dot * ny; }
          addSparks(o.x, o.y, 3, '#9a9ab0');
          s.hitT -= dt;
          if (s.hitT <= 0) { s.hitT = .5; hitOrb(o, 4, owner, true); }
        }
      }
    }
    if (s.type === 'laserring') { // 科技X：6 圈激光保护，越靠内伤害越高
      const owner = ownerOf(s.owner);
      if (!owner || !owner.alive) { s.dead = true; continue; }
      s.x = owner.x; s.y = owner.y;
      for (const o of B.orbs) {
        if (o === owner || !o.alive || o.invT > 0) continue;
        const d = Math.hypot(o.x - s.x, o.y - s.y);
        if (d < o.r + 78) { // 贴身内圈
          s.hitT[6] -= dt;
          if (s.hitT[6] <= 0) { s.hitT[6] = .6; hitOrb(o, 18, owner, true); addSparks(o.x, o.y, 6, '#5ef0ff'); }
          continue;
        }
        for (let k = 0; k < 6; k++) {
          const rr = 78 + k * 58;
          if (Math.abs(d - rr) < 26) {
            s.hitT[k] -= dt;
            if (s.hitT[k] <= 0) {
              s.hitT[k] = .5;
              hitOrb(o, 15 - k * 2, owner, true); // 内圈 15 伤 → 外圈 5 伤
              addSparks(o.x, o.y, 5, '#5ef0ff');
            }
            break;
          }
        }
      }
    }
    if (s.type === 'laserbeams') { // 科技X（半血后）：以自身为中心 6 条旋转激光柱
      const owner = ownerOf(s.owner);
      if (!owner || !owner.alive) { s.dead = true; continue; }
      s.x = owner.x; s.y = owner.y;
      for (let i = 0; i < 6; i++) {
        const a = s.rot + i * TAU / 6;
        const ex = s.x + Math.cos(a) * 620, ey = s.y + Math.sin(a) * 620;
        for (const o of B.orbs) {
          if (o === owner || !o.alive || o.invT > 0) continue;
          if (distToSeg(o.x, o.y, s.x, s.y, ex, ey) < o.r + 16) {
            s.hitT[i] -= dt;
            if (s.hitT[i] <= 0) {
              s.hitT[i] = .4;
              hitOrb(o, 8, owner, true);
              addSparks(o.x, o.y, 5, '#5ef0ff');
            }
            break;
          }
        }
      }
      if (Math.random() < .6) { // 光柱流动粒子
        const i = Math.floor(Math.random() * 6);
        const a = s.rot + i * TAU / 6;
        const k = rand(.1, .95);
        addFx({ type: 'spark', x: s.x + Math.cos(a) * 620 * k, y: s.y + Math.sin(a) * 620 * k, vx: rand(-8, 8), vy: rand(-8, 8), life: 0, maxLife: .25, size: 2.4, color: '#5ef0ff' });
      }
    }
  }
  B.structs = B.structs.filter(s => !s.dead && (s.life === undefined || s.life > 0));
}

// 替身受损：3 点耐久，每次碰撞/挡弹扣 1，耐久归零才消失（V7，顶层函数供测试注入调用）
function damageClone(c, p) {
  if (c.durability > 1) {
    c.durability--;
    addText(c.x, c.y - 30, '替身耐久 ' + c.durability + '/3', '#ffffff', 12);
    addSparks(c.x, c.y, 4, '#ffffff');
    sfx('shieldBrk');
  } else {
    c.life = 0;
    addRing(c.x, c.y, 50, '#ffffff', 2.5);
    addSparks(c.x, c.y, 12, '#ffffff');
    addText(c.x, c.y - 30, '替身击破', '#ffffff', 13);
    sfx('shieldBrk');
  }
  if (p) p.life = 0; // 撞击来源（追踪弹）消失
}
// ---------------- 战斗更新 ----------------
// 球出局（多球：出局但战斗继续；只剩 1 球或双球单方死亡 → 结算）
// alive 守卫：多球模式出局后 battle.over 未置位，下一帧死亡检查会再次进入 → 防重复 boom/震屏/音效
function killOrb(o) {
  if (battle.over || !o.alive) return;
  o.hp = 0; o.alive = false;
  boom(o);
  const alive = battle.orbs.filter(x => x.alive);
  if (alive.length <= 1) {
    battle.over = true;
    battle.winner = alive[0] || null;
    const B = battle;
    setTimeout(() => { if (battle === B) showResult(); }, 950);
  } else {
    addText(o.x, o.y - 50, o.name + ' 出局', '#ff5566', 18);
    sfx('boom');
  }
}
function updateBattle(dt) {
  const B = battle;
  B.time += dt;
  const L = B.left, R = B.right;
  // 120 秒超时：零干预——直接按剩余血量比例判定胜负
  if (B.time >= 120 && !B.over) {
    B.over = true;
    for (const o of B.orbs) { o.regenT = 0; o.cd = 0; } // 冻结回血/冷却，保证结算显示与判定时刻一致
    const alive = B.orbs.filter(o => o.alive);
    let best = null;
    for (const o of alive) if (!best || o.hp / o.maxHp > best.hp / best.maxHp) best = o;
    const pct = alive.map(o => o.hp / o.maxHp);
    const draw = alive.length > 0 && pct.every(p => Math.abs(p - pct[0]) < 1e-9);
    B.winner = alive.length === 0 || draw ? null : best;
    const B2 = B;
    setTimeout(() => { if (battle === B2) showResult(); }, 950);
    return;
  }
  // 移动 + 两两碰撞（2/3/4 球全排列）
  for (const o of B.orbs) if (o.alive) moveOrb(o, dt, nearestFoe(o));
  for (let i = 0; i < B.orbs.length; i++)
    for (let j = i + 1; j < B.orbs.length; j++)
      if (B.orbs[i].alive && B.orbs[j].alive) collide(B.orbs[i], B.orbs[j]);
  updateStructs(dt);
  // 吸血鬼吸身：两球贴合吸血（90% 庇护在 hitOrb 中处理）
  if (B.vamp && B.vamp.t > 0) {
    B.vamp.t -= dt;
    const v = B.vamp, A = v.src, C = v.foe;
    if (B.vamp.t <= 0 || !A.alive || !C.alive) {
      if (A.alive) {
        A.vampT = 1.2; // 吸身结束冷却：1.2s 后可再次触发（修复浮点负值卡死）
        // 沿法线分离两球（吸身期间速度被平均化，若不分离则同速贴合永远无法再触发碰撞吸血）
        const dx = C.x - A.x, dy = C.y - A.y;
        const dd2 = Math.hypot(dx, dy) || 1;
        const nx2 = dx / dd2, ny2 = dy / dd2;
        const sep = 120;
        A.vx += -nx2 * sep; A.vy += -ny2 * sep;
        C.vx += nx2 * sep; C.vy += ny2 * sep;
      }
      B.vamp = null;
    }
    else {
      const F = fieldRect();
      const minX = F.x + A.r, maxX = F.x + F.s - A.r;
      const minY = F.y + A.r, maxY = F.y + F.s - A.r;
      const midx = (A.x + C.x) / 2, midy = (A.y + C.y) / 2;
      const dx = C.x - A.x, dy = C.y - A.y;
      const dd = Math.hypot(dx, dy) || 1;
      const nx = dx / dd, ny = dy / dd;
      const avx = (A.vx + C.vx) / 2, avy = (A.vy + C.vy) / 2;
      A.vx = avx; A.vy = avy; C.vx = avx; C.vy = avy;
      let ax = midx - nx * (A.r - 2), ay = midy - ny * (A.r - 2);
      let cx = midx + nx * (C.r - 2), cy = midy + ny * (C.r - 2);
      // 贴合对整体平移，保证两球都在场内（墙边吸身不再把球挤出边界引发反复反弹）
      const minAx = Math.min(ax, cx), maxAx = Math.max(ax, cx);
      const minAy = Math.min(ay, cy), maxAy = Math.max(ay, cy);
      let shx = 0, shy = 0;
      if (minAx < minX) shx = minX - minAx; else if (maxAx > maxX) shx = maxX - maxAx;
      if (minAy < minY) shy = minY - minAy; else if (maxAy > maxY) shy = maxY - maxAy;
      ax += shx; cx += shx; ay += shy; cy += shy;
      if (ax < minX - .5 || cx > maxX + .5 || ay < minY - .5 || cy > maxY + .5) {
        A.vampT = 1.2; // 墙边空间不足：吸身中断并进入冷却
        B.vamp = null; // 墙边空间不足：吸身中断，避免卡死
      } else {
        A.x = ax; A.y = ay; C.x = cx; C.y = cy;
        if (C.invT <= 0) C.hp -= 7.5 * dt; // 无敌期吸身不掉血
        A.hp = Math.min(A.maxHp, A.hp + 5 * dt);
        if (Math.random() < .7) addFx({ type: 'spark', x: midx + rand(-20, 20), y: midy + rand(-20, 20), vx: rand(-20, 20), vy: rand(-40, -10), life: 0, maxLife: .5, size: 2.4, color: '#ff2244' });
        if (Math.random() < .3) addText(midx, midy - 42, '吸血', '#ff5060', 13);
      }
    }
  }
  // 场地漂浮粒子更新
  const F2 = fieldRect();
  for (const p of B.ambient) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < F2.x) p.x = F2.x + F2.s;
    if (p.x > F2.x + F2.s) p.x = F2.x;
    if (p.y < F2.y) p.y = F2.y + F2.s;
    if (p.y > F2.y + F2.s) p.y = F2.y;
  }
  // 球尾迹粒子（动态光点）
  for (const o of B.orbs) {
    if (!o.alive) continue;
    const isTrail = o.decor === 'trail';
    if (Math.random() < (isTrail ? 1 : .55)) {
      const ang = Math.atan2(-o.vy, -o.vx) + rand(-.35, .35);
      addFx({ type: 'spark', x: o.x + Math.cos(ang) * o.r * .85, y: o.y + Math.sin(ang) * o.r * .85, vx: Math.cos(ang) * rand(50, 110), vy: Math.sin(ang) * rand(50, 110), life: 0, maxLife: rand(.3, .6), size: rand(1.5, 3), color: isTrail ? '#ffffff' : o.color.bright });
    }
  }
  // 技能冷却与释放
  for (const o of B.orbs) {
    if (!o.alive) continue;
    o.cd += dt;
    if (o.cd >= o.maxCd) fireAbility(o);
    if (o.shieldT > 0) o.shieldT -= dt;
    if (o.invT > 0) o.invT -= dt;
    if (o.rushT > 0) o.rushT -= dt;
    if (o.regenT > 0) {
